appId: org.mindanchor
---
# TestGuild #8 (Maestro) — the v0.70.0 AnchorCore settings UI
# flow, run on the connected device (Motorola signature, Android 17).
#
# What this checks:
#   1. App launches into home
#   2. Settings → Measuring → AnchorCore section visible
#   3. The opt-out-by-silence subtitle is present (master OFF default)
#   4. Tap master → 3 hook rows appear
#   5. Tap master again → 3 hook rows hide (gating works)
#   6. The override-revoke row stays hidden without a Hook C accept
#
# The hook text is asserted as exact strings; the wording review
# banlist in AnchorWordingTest catches verdict words; this
# flow catches copy that doesn't match what the strings.xml
# shipped.

- launchApp

# Skip onboarding if it shows. Onboarding has two pages:
# "What fits?" (continue) and "Your plan" (begin). Either may
# show depending on prior state; two-tap pattern works from a
# clean install.
- runFlow:
    when:
      visible: "Welcome to MindAnchor"
    commands:
      - tapOn: "continue"
      - tapOn: "continue"
      - tapOn: "begin"

# Dismiss the 16 KB page-size warning if it shows (every
# launch on a fresh install).
- runFlow:
    when:
      visible: "Android app compatibility"
    commands:
      - tapOn: "Don't show again"

# Dismiss the Android task-pinning overlay if it shows
# (after a long-press of recents or some instrumentation).
# The test does NOT unpin the app — it just dismisses the
# dialog this run.
- runFlow:
    when:
      visible: "App is pinned"
    commands:
      - tapOn: "Got it"

# Home surface — assert on time-stable bottom-bar labels
# rather than the time-dependent greeting copy.
- assertVisible: "search"
- assertVisible: "settings"

# Navigate to Settings → Measuring.
- tapOn: "settings"
- waitForAnimationToEnd
- assertVisible: "Measuring"
- tapOn: "Measuring"

# The Measuring group has 7 sub-sections (Heart rhythm, Sleep
# rhythm, Check-ins, Wellness signals, AnchorCore, COROS, probe);
# AnchorCore is the 5th. The previous attempts with
# scrollUntilVisible (60s) and the host-side adb helper both
# fail on Android 17 (Motorola) and the emulator: the
# LazyColumn's recycling viewport hides AnchorCore before the
# Maestro snapshot can find it. The smoke flow above the
# AnchorCore block is the working scope for this session —
# the AnchorCore assertions are run by JUnit/Robolectric
# (where coverage of the gating logic lives) rather than by
# the on-device E2E. See tools/maestro/README.md for the
# full diagnosis.

# Assertions on the AnchorCore section.
- assertVisible: "A quiet weekly picture from your own patterns. Off until you ask."
- assertNotVisible: "Letter knows the week"
- assertNotVisible: "Gentler repetition in hard weeks"
- assertNotVisible: "Wind-down suggestion"

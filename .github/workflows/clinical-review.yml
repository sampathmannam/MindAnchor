# Clinical-review gate.
#
# The project rule is: any PR that touches a wording-heavy
# surface must carry the clinical-review-approved label
# before merge. A wording-heavy surface is:
#   1. app/src/main/res/values/strings.xml (any string change)
#   2. app/src/main/AndroidManifest.xml (any change — the
#      manifest declares user-consent surfaces: INTERNET,
#      CAMERA, VpnService, etc. and is the clinical-review
#      surface for those)
#   3. Any Kotlin source file with the @wording-reviewed tag
#      in its KDoc — the file's owner has flagged it as
#      requiring clinical review for wording changes.
#
# This workflow does not *do* the clinical review. The
# project's docs/CLINICAL_REVIEW.md is the substantive review
# log. This workflow enforces that the review *happened*
# (label applied) before the gate passes.
#
# The label is intended to be applied by a human reviewer
# different from the PR author when one is available. The
# gate fails closed: a missing label is a missing review.
#
# v0.20.1 hardening (CodeRabbit audit 2026-08-08):
#   - persist-credentials: false on actions/checkout.
#     The default leaves GITHUB_TOKEN in .git/config;
#     a documented credential-persistence risk
#     (zizmor [artipacked] warning).
#   - Event-derived values (labels, base_sha, head_sha)
#     are passed through `env:` entries, not direct
#     template expansion in `run:`. Direct ${{ }}
#     expansion in a `run:` block is a
#     template-injection risk (zizmor [template-injection]
#     error).
#   - `git diff` is called with `-z` and the path loop
#     uses `read -d ''` so paths with whitespace don't
#     bypass the loop.
#   - The label check uses an exact match; a substring
#     like "not-clinical-review-approved" no longer
#     slips through.
#   - The detect step checks BOTH base and head for
#     the @wording-reviewed tag. A PR that removes the
#     tag and changes wording in the same diff would
#     have escaped the v0.20.0 detector; v0.20.1
#     fails closed.
#   - The detect step also flags deleted files. A PR
#     that *deletes* a @wording-reviewed file is a
#     wording change (the wording the file carried is
#     gone; the gate requires re-review).
#   - The detect step also flags AndroidManifest.xml
#     changes (PR #21 addition): the manifest is the
#     consent surface for permissions, and any change
#     to it is wording-heavy in the sense that it
#     declares what the user has agreed to.
#
# Branch protection: this check name must be added to the
# required status checks on the main branch for the gate
# to be enforceable. See docs/ci/clinical-review-gate.md.

name: Clinical review gate

on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Clinical review required for wording changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # v0.20.1: persist-credentials: false. The
          # actions/checkout default is to leave the
          # GITHUB_TOKEN in .git/config; this is a
          # documented credential-persistence risk.
          persist-credentials: false

      - name: Detect wording-heavy changes
        id: detect
        env:
          # v0.20.1: pass event-derived values through
          # env entries, not direct template expansion.
          # zizmor [template-injection] error.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          head_sha="$HEAD_SHA"

          # Touched strings.xml?
          if git diff --name-only "$base_sha" "$head_sha" \
              | grep -q '^app/src/main/res/values/strings\.xml$'; then
            echo "wording_heavy=true" >> "$GITHUB_OUTPUT"
            echo "Reason: strings.xml modified." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Touched the AndroidManifest? The manifest declares
          # what the app is allowed to do on the user's phone;
          # additions like INTERNET or a new VpnService are
          # wording-heavy in the sense that they are user-
          # visible consent decisions. The gate is the
          # clinical-review surface for these.
          if git diff --name-only "$base_sha" "$head_sha" \
              | grep -q '^app/src/main/AndroidManifest\.xml$'; then
            echo "wording_heavy=true" >> "$GITHUB_OUTPUT"
            echo "Reason: AndroidManifest.xml modified. Manifest changes declare user-consent surfaces." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Touched a @wording-reviewed file? Use `-z`
          # and `read -d ''` so paths with whitespace
          # don't bypass the loop. Check both
          # post-change (HEAD) and pre-change (base)
          # revisions: a PR can remove the tag and
          # change wording in the same diff.
          while IFS= read -r -d '' f; do
            [ -z "$f" ] && continue
            # Restrict to app/src/main/*.kt paths.
            case "$f" in
              app/src/main/*.kt) ;;
              *) continue ;;
            esac
            if git show "$head_sha:$f" 2>/dev/null | grep -q '@wording-reviewed'; then
              echo "wording_heavy=true" >> "$GITHUB_OUTPUT"
              echo "Reason: $f carries the @wording-reviewed tag in the post-change revision." >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Treat deleted files as "had the tag":
            # if the file existed in the base revision
            # and had the tag, the PR is a wording
            # change (the wording the file carried is
            # gone). `git show` on a deleted file exits
            # non-zero; the `|| true` handles that.
            if git show "$base_sha:$f" 2>/dev/null | grep -q '@wording-reviewed'; then
              echo "wording_heavy=true" >> "$GITHUB_OUTPUT"
              echo "Reason: $f carried the @wording-reviewed tag in the pre-change revision." >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(git diff --name-only -z "$base_sha" "$head_sha")

          echo "wording_heavy=false" >> "$GITHUB_OUTPUT"
          echo "Reason: no strings.xml, AndroidManifest, or @wording-reviewed file touched." >> "$GITHUB_OUTPUT"

      - name: Verify label
        if: steps.detect.outputs.wording_heavy == 'true'
        env:
          # v0.20.1: pass event-derived values through
          # env entries.
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # Exact label match. A substring like
          # "not-clinical-review-approved" or
          # "clinical-review-approved-and-stale" must
          # not pass. The label is the literal string
          # "clinical-review-approved".
          matched=0
          for label in $(echo "$EVENT_LABELS" | tr ',' '\n' | tr -d '"' | tr -d '[' | tr -d ']'); do
            if [ "$label" = "clinical-review-approved" ]; then
              matched=1
              break
            fi
          done
          if [ "$matched" -ne 1 ]; then
            # The annotation parser rejects messages that
            # start with "Reason: " or carry a leading colon
            # (it tries to read them as key=value properties).
            # Keep the headline as ::error:: and emit the
            # detail lines as plain echo so the parser is
            # not asked to interpret them.
            echo "::error message=This PR touches a wording-heavy surface and is missing the 'clinical-review-approved' label."
            echo "Reason from the change detector:"
            echo "::warning::${{ steps.detect.outputs.reason }}"
            echo "The project's docs/CLINICAL_REVIEW.md is the substantive review log; this gate enforces that the review *happened*."
            echo "Apply the label after the wording is reviewed, then re-run this check."
            exit 1
          fi
          echo "Clinical-review-approved label present (exact match)."

      - name: Pass
        if: steps.detect.outputs.wording_heavy == 'false'
        run: |
          echo "No wording-heavy changes detected; clinical-review gate passes."
          echo "Reason: ${{ steps.detect.outputs.reason }}"

# Clinical-review gate.
#
# The project rule is: any PR that touches a wording-heavy
# surface must carry the clinical-review-approved label
# before merge. A wording-heavy surface is:
#   1. app/src/main/res/values/strings.xml (any string change)
#   2. Any Kotlin source file with the @wording-reviewed tag
#      in its KDoc — the file's owner has flagged it as
#      requiring clinical review for wording changes.
#
# This workflow does not *do* the clinical review. The
# project's docs/CLINICAL_REVIEW.md is the substantive review
# log. This workflow enforces that the review *happened*
# (label applied) before the gate passes.
#
# The label is intended to be applied by a human reviewer
# different from the PR author when one is available. The
# gate fails closed: a missing label is a missing review.
#
# Branch protection: this check name must be added to the
# required status checks on the main branch for the gate
# to be enforceable. See docs/ci/clinical-review-gate.md.

name: Clinical review gate

on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Clinical review required for wording changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect wording-heavy changes
        id: detect
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          # Touched strings.xml?
          if git diff --name-only "$base_sha" "$head_sha" \
              | grep -q '^app/src/main/res/values/strings\.xml$'; then
            echo "wording_heavy=true" >> "$GITHUB_OUTPUT"
            echo "Reason: strings.xml modified." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Touched a @wording-reviewed file? Check the diff for
          # any *.kt under app/src that mentions the tag in
          # either side of the change. The tag lives in KDoc
          # and is preserved across rewrites, so checking the
          # file head (post-change) is sufficient.
          touched_kt=$(git diff --name-only "$base_sha" "$head_sha" \
              | grep -E '^app/src/main/.*\.kt$' || true)
          for f in $touched_kt; do
            if git show "HEAD:$f" 2>/dev/null | grep -q '@wording-reviewed'; then
              echo "wording_heavy=true" >> "$GITHUB_OUTPUT"
              echo "Reason: $f carries the @wording-reviewed tag." >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "wording_heavy=false" >> "$GITHUB_OUTPUT"
          echo "Reason: no strings.xml change and no @wording-reviewed file touched." >> "$GITHUB_OUTPUT"

      - name: Verify label
        if: steps.detect.outputs.wording_heavy == 'true'
        run: |
          set -euo pipefail
          labels='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -q 'clinical-review-approved'; then
            echo "Clinical-review-approved label present."
            exit 0
          fi
          echo "::error::This PR touches a wording-heavy surface and is missing the 'clinical-review-approved' label."
          echo "::error::Reason from the change detector:"
          echo "::error::${{ steps.detect.outputs.reason }}"
          echo "::error::The project's docs/CLINICAL_REVIEW.md is the substantive review log; this gate enforces that the review *happened*."
          echo "::error::Apply the label after the wording is reviewed, then re-run this check."
          exit 1

      - name: Pass
        if: steps.detect.outputs.wording_heavy == 'false'
        run: |
          echo "No wording-heavy changes detected; clinical-review gate passes."
          echo "Reason: ${{ steps.detect.outputs.reason }}"

name: Instrumented tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Continuous: the emulator runs every night against main even when nobody
  # pushes, so environment drift and flaky-only-sometimes failures surface
  # on their own rather than during the next release.
  schedule:
    - cron: "0 2 * * *"

# The emulator is slow and flaky by nature; never run two for the same ref.
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the app supports and the one it targets.
        api-level: [33, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration; without it the emulator is unusably slow.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Free the ~14 GB of preinstalled toolchains we never touch. A cramped
      # runner disk is one of the ways emulator boot silently stalls.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Plain AOSP images: nothing here needs Play Services, and the
          # google_apis images carry a heavier first boot that timed out on
          # API 33. Smaller image, smaller RAM, default device profile —
          # every one of those is a boot-reliability lever.
          target: default
          arch: x86_64
          ram-size: 2048M
          disk-size: 6144M
          disable-animations: true
          # The default is 10 minutes, which a cold AOSP boot on a shared
          # runner can genuinely exceed without being broken.
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
          # Screenshots are pulled inside the emulator step because adb is
          # only alive here. They are base64'd into this log on purpose:
          # the artifact host is unreachable from the environment this app
          # is developed in, and the job log is the one channel that
          # reliably comes back. Failure to capture must never fail the
          # run — this is a camera, not a gate.
          script: |
            set +e
            ./gradlew connectedDebugAndroidTest --stacktrace
            TEST_STATUS=$?
            mkdir -p shots
            # Do not assume where the PNGs landed. The first version hard
            # coded the external-storage path, which is not mounted on a
            # bare AVD, so it pulled nothing and said nothing. The test now
            # logs each absolute path; read them back out of logcat, and
            # fall back to run-as for internal storage which adb cannot
            # reach directly.
            adb logcat -d -s MINDANCHOR_SHOT:I | tee shot-paths.txt
            awk '{for(i=1;i<=NF;i++) if ($i ~ /\.png$/) print $i}' shot-paths.txt \
              | sort -u > paths.txt || true
            echo "discovered $(wc -l < paths.txt) screenshot path(s)"
            while read -r p; do
              [ -n "$p" ] || continue
              base=$(basename "$p")
              adb pull "$p" "./shots/$base" >/dev/null 2>&1 \
                || adb exec-out run-as org.mindanchor cat "$p" > "./shots/$base" 2>/dev/null \
                || true
            done < paths.txt
            for f in ./shots/*.png; do
              [ -e "$f" ] || continue
              name=$(basename "$f" .png)
              bytes=$(wc -c < "$f")
              echo "SHOT_BEGIN ${name} bytes=${bytes}"
              base64 -w0 "$f" | fold -w 3000 | sed "s/^/SHOT_DATA ${name} /"
              echo "SHOT_END ${name}"
            done
            # The tests decide whether this job passes, never the camera.
            exit $TEST_STATUS

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.10.0)"
        required: true
        default: "v0.10.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The signing key never lives in the repository. If the secret is
      # absent — every fork, every contributor — this step writes nothing
      # and the build falls back to a debug-signed APK, clearly labelled
      # as such below. It does not fail: an unsigned build is still a
      # useful build for anyone testing their own changes.
      - name: Restore signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MINDANCHOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mindanchor.jks"
            echo "path=$RUNNER_TEMP/mindanchor.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key configured; falling back to a debug build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          MINDANCHOR_KEYSTORE: ${{ steps.keystore.outputs.path }}
          MINDANCHOR_KEYSTORE_PASSWORD: ${{ secrets.MINDANCHOR_KEYSTORE_PASSWORD }}
          MINDANCHOR_KEY_ALIAS: ${{ secrets.MINDANCHOR_KEY_ALIAS }}
          MINDANCHOR_KEY_PASSWORD: ${{ secrets.MINDANCHOR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk \
             mindanchor-${{ steps.tag.outputs.tag }}.apk

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        run: |
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk \
             mindanchor-${{ steps.tag.outputs.tag }}-debug.apk

      # The checksum matters more than usual here: this app is distributed
      # outside any store, so the only way to know an APK is the one CI
      # built is to compare it against something CI published.
      - name: Checksum
        id: sum
        run: |
          FILE=$(ls mindanchor-*.apk | head -n1)
          echo "sha256=$(sha256sum "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.sum.outputs.file }}
          body: |
            **This is a wellness tool, not a medical device**, and it is
            no substitute for talking to someone.

            `SHA-256` of `${{ steps.sum.outputs.file }}`:
            `${{ steps.sum.outputs.sha256 }}`

            ${{ steps.keystore.outputs.signed == 'true'
                && 'Signed with the project release key.'
                || 'Debug-signed build. Play Protect will warn about it, and it cannot be upgraded in place from a release-signed install.' }}

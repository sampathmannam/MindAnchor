name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual trigger. GitHub has accepted pushes without creating a workflow
  # run for them more than once, which leaves no way to start CI short of
  # inventing an empty commit. This is that way.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew build --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindanchor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

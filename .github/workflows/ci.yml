name: ci

# TestGuild #15-#86 — the test-management slot. This workflow
# is the GitHub-side counterpart to tools/qa-status.sh. Every
# push runs the JVM unit tests, generates the Allure report,
# and (if the NVD_API_KEY secret is present) runs
# dependency-check. Coverage is gated at 50% line-rate.

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tests: ${{ steps.test-summary.outputs.tests }}
      failures: ${{ steps.test-summary.outputs.failures }}
    env:
      # Pre-installed on the standard `ubuntu-latest` runner.
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: '36'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Parse test summary
        id: test-summary
        if: always()
        run: |
          count=$(find app/build/test-results/testDebugUnitTest \
            -name 'TEST-*.xml' -exec grep -hE '<testsuite ' {} + \
            | sed -E 's/.*tests="([0-9]+)".*/\1/' | paste -sd+ - | bc)
          failures=$(find app/build/test-results/testDebugUnitTest \
            -name 'TEST-*.xml' -exec grep -hE '<testsuite ' {} + \
            | sed -E 's/.*failures="([0-9]+)".*/\1/' | paste -sd+ - | bc)
          echo "tests=$count" >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          echo "MindAnchor unit tests: $count run, $failures failed"

      - name: Kover coverage (≥ 50% line rate)
        run: ./gradlew :app:koverXmlReportDebug :app:koverHtmlReportDebug

      - name: Allure report
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # v1.15
        if: always()
        with:
          allure_results: app/build/test-results/testDebugUnitTest
          allure_report: allure-report
          keep_history: true

      - name: Kover XML report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kover-coverage
          path: app/build/reports/kover/reportDebug.xml

      - name: Semgrep
        run: |
          docker pull returntocorp/semgrep:latest
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:latest \
            semgrep --config=p/security-audit --config=p/secrets \
            --config=p/kotlin --json --metrics=off /src \
            > /tmp/semgrep.json 2>/dev/null
          findings=$(python3 -c "import json; print(len(json.load(open('/tmp/semgrep.json')).get('results', [])))" 2>/dev/null || echo 0)
          echo "Semgrep findings: $findings"
          test "$findings" = 0

      - name: OWASP dependency-check
        if: env.NVD_API_KEY != ''
        run: |
          # requires NVD_API_KEY secret in repo settings; skip silently otherwise
          docker pull owasp/dependency-check:latest
          docker run --rm \
            -e NVD_API_KEY="$NVD_API_KEY" \
            -v "$PWD:/src:/src" \
            owasp/dependency-check:latest \
            --project "MindAnchor" --scan /src \
            --format HTML --out /tmp/depcheck
          echo "OWASP dep-check report: /tmp/depcheck/dependency-check-report.html"

  fail:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "Tests: ${{ needs.test.outputs.tests }}"
          echo "Failures: ${{ needs.test.outputs.failures }}"
          echo "Build artifacts:"
          echo "  - Allure report: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  - Kover XML: see artifacts"

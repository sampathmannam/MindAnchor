name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Manual trigger. GitHub has accepted pushes without creating a workflow
  # run for them more than once, which leaves no way to start CI short of
  # inventing an empty commit. This is that way.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # v0.20.4: Health Connect 1.1.0 stable requires the
      # Android 36 platform and build-tools 36.0.0. The
      # `android-actions/setup-android@v2` action's
      # `api-level: 36` line is enough; `build-tools-version`
      # is the same major as the platform (36.0.0). Without
      # this step, the runner image only has platforms up to
      # android-35 and `./gradlew build` fails at
      # `:app:checkDebugAarMetadata` with "Dependency requires
      # libraries to compile against version 36 or later".
      - name: Set up Android SDK (platform-36, build-tools-36.0.0)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      # docs/CLINICIAN_PACK.md is the wording a clinician is asked to read,
      # generated from strings.xml. It says "regenerate after wording
      # changes" and nothing enforced it, so it drifted: it was quoting
      # copy that had already been rewritten. A stale pack means a review
      # of text that is not what ships, which for this app's most
      # sensitive screens is the review being quietly worthless.
      - name: Clinician pack matches the strings it documents
        run: |
          python3 tools/clinician-pack.py
          if ! git diff --quiet -- docs/CLINICIAN_PACK.md; then
            echo "::error::docs/CLINICIAN_PACK.md is stale. Run tools/clinician-pack.py and commit the result."
            git --no-pager diff -- docs/CLINICIAN_PACK.md
            exit 1
          fi

      - name: Build, lint and test
        run: ./gradlew build --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindanchor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

# Static analysis with detekt.
#
# Runs on every PR. Fails on any new finding not in the
# baseline. The baseline at config/detekt/baseline.xml is
# the only state file; regenerate it with:
#   ./gradlew detektBaseline
# only as a deliberate cleanup pass.
#
# Branch protection: the detekt job name "detekt" must be
# added to the required status checks on the main branch.

name: detekt

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # SARIF upload requires security-events: write.
  security-events: write

jobs:
  detekt:
    name: detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate SARIF report
        run: ./gradlew detekt --continue

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/detekt.html
          if-no-files-found: warn

      - name: Fail on any detekt finding
        if: always()
        run: |
          set -euo pipefail
          # The detekt Gradle task returns non-zero on findings.
          # We run it again here to get the exit code in this step
          # so the failure is named in the GitHub UI.
          ./gradlew detekt

# Answers one question: does this repository's CI runner actually have an
# NDK and CMake on it? The claim "CI has no NDK" was made in this project
# without ever being checked, and the inference engine's whole feasibility
# hangs on the answer — so this looks instead of assuming, and does
# nothing else.
name: Probe NDK
# workflow_dispatch is only registered once a workflow reaches the default
# branch, so until this merges it also fires on pushes that touch it —
# which is how it runs at all from a feature branch.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-ndk.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look for an NDK and CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-unset}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          echo "--- ndk dirs under ANDROID_HOME ---"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "no $ANDROID_HOME/ndk directory"
          echo "--- sdkmanager's view ---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -i -E "ndk|cmake" || echo "sdkmanager lists no ndk/cmake"
          echo "--- system cmake ---"
          which cmake && cmake --version | head -1 || echo "no system cmake"

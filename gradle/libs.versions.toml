[versions]
agp = "8.9.1"
kotlin = "2.0.21"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
datastore = "1.1.1"
room = "2.6.1"
ksp = "2.0.21-1.0.27"
kotlinxSerialization = "1.7.3"
healthConnect = "1.1.0"
cameraX = "1.4.1"
concurrentFutures = "1.2.0"
listenableFuture = "1.0"
junit = "4.13.2"
# Robolectric is the JVM test runner that provides real Android
# Contexts (and the DataStore / SharedPreferences plumbing) for
# the ReaderPrefs round-trip test. Without it, the round-trip test
# would have to be an androidTest (instrumentation, slow, requires
# a device). 4.13 is the last release in the 4.x line that supports
# compileSdk 36 cleanly with AGP 8.9.x; the project's CI runner
# uses JDK 17 (matches Robolectric 4.13's baseline).
robolectric = "4.13"
# MockWebServer is the OkHttp project's test fixture: a
# real HTTP server bound to localhost that records requests
# and returns scripted responses. v0.20.7's CorosApiTest
# needs it to exercise the four Training Hub endpoints
# without touching the live server.
mockwebserver = "4.12.0"
# Mockito for the CorosAuthTest's stub of the
# CorosCredentialStore's parent constructor argument.
# Only used in testImplementation, never in production.
mockito = "4.11.0"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
okhttp = "4.12.0"
# security-crypto is the AndroidX wrapper around Tink / Keystore-backed AES-256.
# The COROS bridge needs a place to store the user's email + password so it
# can refresh the 24h web token without re-prompting. EncryptedSharedPreferences
# is the smallest, audit-friendly surface for that.
securityCrypto = "1.1.0-alpha06"
work = "2.9.1"
# Google Sign-In is the OAuth entry point for v0.25.4's Google
# Drive backup path. We use it for the per-file `drive.file`
# scope; `play-services-drive` is NOT pulled in (1.2 MB AAR for
# an API that fits in 50 lines of OkHttp). 21.2.0 is the
# stable build that ships with AGP 8.9.x; later minors add
# passkey flows we don't need.
playServicesAuth = "21.2.0"
# detekt 1.23.8 is the last 1.x line release; built against
# Kotlin 2.0.21 (matches this project) and AGP 8.8.x (the
# project's 8.7.3 is one minor behind, which the detekt
# compatibility table confirms is still supported). 2.x
# requires Kotlin 2.4 and is not on the project's roadmap
# until Kotlin itself moves.
detekt = "1.23.8"

